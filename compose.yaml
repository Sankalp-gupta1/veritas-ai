services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: veritas
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: veritas_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - veritas_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritas -d veritas"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["python", "scripts/migrate.py"]
    environment:
      DATABASE_URL: postgresql://veritas:veritas_local_only@db:5432/veritas
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://veritas:veritas_local_only@db:5432/veritas
      APP_ENV: development
      VERITAS_VAULT_KEY: ${VERITAS_VAULT_KEY:?Create a private vault key in .env before starting}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  veritas_database:

