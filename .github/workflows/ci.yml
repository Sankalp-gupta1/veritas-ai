name: Tests and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: veritas_test
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: fixture_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veritas -d veritas_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://veritas:fixture_only@localhost:5432/veritas_test
      VERITAS_INTEGRATION_TEST: "1"
      APP_ENV: development
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python scripts/download_models.py
      - run: python scripts/migrate.py
      - run: python -m pytest tests -q
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
